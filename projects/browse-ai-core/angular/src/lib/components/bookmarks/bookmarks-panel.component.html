@let strings = t();
<div class="min-h-0 flex-1 overflow-y-auto p-4">
  <section class="mb-4 rounded-bac border border-bac-border bg-bac-surface p-3">
    <p class="text-xs text-bac-text-muted">{{ strings.bookmarksText }}</p>
    <bac-button
      class="mt-3"
      variant="secondary"
      icon="trash"
      [label]="strings.clearAll"
      [disabled]="categories().length === 0"
      (buttonClick)="clearAll()"
    />
  </section>

  @for (category of categories(); track category.name) {
    <bac-accordion
      class="mb-2"
      [title]="category.name"
      [count]="category.entries.length"
      [deleteLabel]="strings.deleteCategory"
      [expanded]="expanded().has(category.name)"
      (expandedChange)="setExpanded(category.name, $event)"
      (deleted)="service.deleteCategory(category.name)"
    >
      <ul class="space-y-1">
        @for (bookmark of category.entries; track bookmark.url) {
          <li
            class="group flex items-center gap-2 rounded-bac px-2 py-1.5 hover:bg-bac-surface-hover"
          >
            <a
              class="min-w-0 flex-1 focus-visible:outline-2 focus-visible:outline-bac-primary"
              target="_blank"
              rel="noopener noreferrer"
              [href]="bookmark.url"
              [title]="bookmark.url"
            >
              <span class="block truncate text-sm font-medium">{{
                bookmark.title
              }}</span>
              <span class="block truncate text-xs text-bac-text-muted">{{
                bookmark.url
              }}</span>
            </a>
            <bac-button
              class="opacity-100 sm:opacity-0 sm:group-hover:opacity-100 sm:focus-within:opacity-100"
              variant="ghost"
              icon="trash"
              [ariaLabel]="strings.deleteBookmark"
              (buttonClick)="
                service.deleteBookmark(category.name, bookmark.url)
              "
            />
          </li>
        }
      </ul>
    </bac-accordion>
  } @empty {
    <p
      class="rounded-bac border border-bac-border bg-bac-surface px-3 py-2 text-xs"
    >
      {{ strings.noBookmarks }}
    </p>
  }
</div>
