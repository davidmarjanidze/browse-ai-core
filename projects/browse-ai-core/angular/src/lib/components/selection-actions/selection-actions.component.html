@if (position(); as position) {
  <div
    role="toolbar"
    part="selection-actions"
    class="fixed z-[2147483647] flex max-w-[calc(100vw-16px)] flex-wrap gap-1 rounded-bac border border-bac-border bg-bac-bg p-1 text-bac-text shadow-lg"
    [attr.aria-label]="t().selectionActions"
    [style.top.px]="position.top"
    [style.left.px]="position.left"
    (mousedown)="$event.preventDefault()"
  >
    @for (action of actions(); track action.tool) {
      <button
        type="button"
        class="min-h-8 pointer-coarse:min-h-11 rounded-bac px-2.5 text-xs font-semibold hover:bg-bac-surface-hover disabled:opacity-60 focus-visible:outline-2 focus-visible:outline-bac-primary"
        [disabled]="session.isBusy()"
        (click)="run(action.tool)"
      >
        {{ action.label }}
      </button>
    }
  </div>
}
