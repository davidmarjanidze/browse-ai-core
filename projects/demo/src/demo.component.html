<main
  style="
    font-family: system-ui;
    max-width: 720px;
    margin: 2rem auto;
    padding: 0 16px;
  "
>
  <h1>browse-ai-core demo</h1>
  <p style="display: flex; flex-wrap: wrap; gap: 8px">
    <label>
      Palette
      <select (change)="setPalette($event)">
        @for (name of palettes; track name) {
          <option [value]="name">{{ name }}</option>
        }
      </select>
    </label>
    <label>
      Theme
      <select (change)="setTheme($event)">
        <option value="system">system</option>
        <option value="light">light</option>
        <option value="dark">dark</option>
      </select>
    </label>
    <button type="button" (click)="open.set(!open())">Toggle chat</button>
  </p>

  <form style="display: flex; flex-wrap: wrap; gap: 8px">
    <label>Name <input name="name" /></label>
    <label>Email <input name="email" type="email" /></label>
  </form>

  <h2>Shop (try Agent Mode)</h2>
  @for (product of products; track product.name) {
    <p style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
      <span>{{ product.name }}: ${{ product.price }}</span>
      <label>
        Size
        <select #size [attr.aria-label]="'Size of ' + product.name">
          <option>S</option>
          <option>M</option>
          <option>L</option>
        </select>
      </label>
      <button type="button" (click)="addToCart(product.name, size.value)">
        Add {{ product.name }} to cart
      </button>
    </p>
  }
  <p>Cart: {{ cart().length ? cart().join(', ') : 'empty' }}</p>
  <button type="button" [disabled]="!cart().length" (click)="ordered.set(true)">
    Place order
  </button>
  @if (ordered()) {
    <p>Order placed.</p>
  }

  <h2>Ticker (try Watch Mode)</h2>
  <p id="ticker">ACME stock: ${{ price() }}</p>

  <h2>Inline chat</h2>
  <div style="height: 480px">
    <browse-ai-core mode="inline" [palette]="palette()" [theme]="theme()" />
  </div>
</main>

<browse-ai-core [palette]="palette()" [theme]="theme()" [(open)]="open" />
